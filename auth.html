<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Suivi Progression</title>
<link rel="stylesheet" href="style.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--bg); }
  .auth-card { background:var(--card); border-radius:16px; padding:2.5rem 2rem; width:100%; max-width:420px; box-shadow:0 4px 24px rgba(0,0,0,.12); }
  .auth-logo { font-size:2.5rem; text-align:center; margin-bottom:.25rem; }
  .auth-title { text-align:center; font-size:1.3rem; font-weight:700; color:var(--txt); margin-bottom:.25rem; }
  .auth-sub { text-align:center; font-size:.85rem; color:var(--txt2); margin-bottom:2rem; }
  .tabs { display:flex; gap:0; border-radius:10px; overflow:hidden; border:1px solid var(--border); margin-bottom:1.5rem; }
  .tab { flex:1; padding:.6rem; text-align:center; cursor:pointer; font-size:.9rem; color:var(--txt2); background:transparent; border:none; transition:all .2s; }
  .tab.active { background:var(--accent); color:#fff; font-weight:600; }
  .form-group { margin-bottom:1rem; }
  label { display:block; font-size:.82rem; font-weight:600; color:var(--txt2); margin-bottom:.35rem; }
  input[type=email], input[type=password], input[type=text] {
    width:100%; padding:.65rem .9rem; border:1.5px solid var(--border); border-radius:8px;
    font-size:.95rem; color:var(--txt); background:var(--bg); box-sizing:border-box;
    transition:border-color .2s; outline:none;
  }
  input:focus { border-color:var(--accent); }
  .btn-primary { width:100%; padding:.75rem; background:var(--accent); color:#fff; border:none; border-radius:9px; font-size:1rem; font-weight:700; cursor:pointer; margin-top:.5rem; transition:opacity .2s; }
  .btn-primary:hover { opacity:.88; }
  .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
  .msg { margin-top:1rem; padding:.7rem 1rem; border-radius:8px; font-size:.88rem; text-align:center; display:none; }
  .msg.error { background:#fee2e2; color:#b91c1c; display:block; }
  .msg.success { background:#d1fae5; color:#065f46; display:block; }
  .forgot { text-align:right; font-size:.8rem; margin-top:-.5rem; margin-bottom:1rem; }
  .forgot a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<div class="auth-card">
  <div class="auth-logo">📚</div>
  <div class="auth-title">Suivi de Progression</div>
  <div class="auth-sub">Mathématiques · Sciences · Techno</div>

  <div class="tabs">
    <button class="tab active" id="tab-login" onclick="showTab('login')">Connexion</button>
    <button class="tab" id="tab-register" onclick="showTab('register')">Inscription</button>
  </div>

  <!-- Connexion -->
  <form id="form-login" onsubmit="doLogin(event)">
    <div class="form-group">
      <label>Adresse e-mail</label>
      <input type="email" id="login-email" placeholder="vous@example.com" required autocomplete="email">
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" id="login-pwd" placeholder="••••••••" required autocomplete="current-password">
    </div>
    <div class="forgot"><a href="#" onclick="doForgot(event)">Mot de passe oublié ?</a></div>
    <button type="submit" class="btn-primary" id="btn-login">Se connecter</button>
  </form>

  <!-- Inscription -->
  <form id="form-register" style="display:none" onsubmit="doRegister(event)">
    <div class="form-group">
      <label>Prénom et nom</label>
      <input type="text" id="reg-nom" placeholder="Ex : Marie Dupont" required>
    </div>
    <div class="form-group">
      <label>Établissement</label>
      <input type="text" id="reg-etab" placeholder="Lycée professionnel…" required>
    </div>
    <div class="form-group">
      <label>Adresse e-mail</label>
      <input type="email" id="reg-email" placeholder="vous@example.com" required autocomplete="email">
    </div>
    <div class="form-group">
      <label>Mot de passe (6 car. min.)</label>
      <input type="password" id="reg-pwd" placeholder="••••••••" required minlength="6" autocomplete="new-password">
    </div>
    <button type="submit" class="btn-primary" id="btn-register">Créer mon compte</button>
  </form>

  <div class="msg" id="auth-msg"></div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

function showTab(t) {
  document.getElementById('form-login').style.display    = t==='login'    ? '' : 'none';
  document.getElementById('form-register').style.display = t==='register' ? '' : 'none';
  document.getElementById('tab-login').classList.toggle('active',    t==='login');
  document.getElementById('tab-register').classList.toggle('active', t==='register');
  clearMsg();
}

function showMsg(txt, type='error') {
  const el = document.getElementById('auth-msg');
  el.textContent = txt; el.className = 'msg ' + type;
}
function clearMsg() { document.getElementById('auth-msg').className='msg'; }

async function doLogin(e) {
  e.preventDefault(); clearMsg();
  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = 'Connexion…';
  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById('login-email').value.trim(),
    password: document.getElementById('login-pwd').value
  });
  if (error) { showMsg(error.message); btn.disabled=false; btn.textContent='Se connecter'; }
  else window.location.href = 'index.html';
}

async function doRegister(e) {
  e.preventDefault(); clearMsg();
  const btn = document.getElementById('btn-register');
  btn.disabled = true; btn.textContent = 'Création…';
  const nom   = document.getElementById('reg-nom').value.trim();
  const etab  = document.getElementById('reg-etab').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pwd   = document.getElementById('reg-pwd').value;
  const { data, error } = await sb.auth.signUp({ email, password: pwd });
  if (error) { showMsg(error.message); btn.disabled=false; btn.textContent='Créer mon compte'; return; }
  // Mettre à jour le profil
  if (data.user) {
    await sb.from('profiles').upsert({ id: data.user.id, nom, etablissement: etab });
  }
  showMsg('Compte créé ! Vérifiez votre e-mail pour confirmer, puis connectez-vous.', 'success');
  btn.disabled=false; btn.textContent='Créer mon compte';
  setTimeout(()=>showTab('login'), 3000);
}

async function doForgot(e) {
  e.preventDefault();
  const email = document.getElementById('login-email').value.trim();
  if (!email) { showMsg('Saisissez votre e-mail pour réinitialiser.'); return; }
  await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/progression/index.html' });
  showMsg('E-mail de réinitialisation envoyé !', 'success');
}

// Si déjà connecté → app
sb.auth.getSession().then(({ data:{ session } }) => {
  if (session) window.location.href = 'index.html';
});
</script>
</body>
</html>
